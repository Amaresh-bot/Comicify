<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comicify</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFE93E;
      --red:    #E8372C;
      --blue:   #1A47B8;
      --black:  #0D0D0D;
      --white:  #FFFEF5;
      --dot-size: 4px;
      --dot-gap:  20px;
    }

    body {
      background-color: var(--yellow);
      background-image: radial-gradient(circle, #ccc 1px, transparent 1px);
      background-size: var(--dot-gap) var(--dot-gap);
      font-family: 'Comic Neue', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .panel {
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      border-radius: 4px;
      max-width: 620px;
      width: 100%;
      padding: 2.5rem 2.5rem 2rem;
      position: relative;
    }

    /* Decorative corner stars */
    .panel::before, .panel::after {
      content: '★';
      position: absolute;
      font-size: 1.4rem;
      color: var(--red);
      top: -1rem;
    }
    .panel::before { left: 1rem; }
    .panel::after  { right: 1rem; }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(3rem, 10vw, 5rem);
      letter-spacing: 4px;
      color: var(--black);
      text-align: center;
      line-height: 1;
      /* Comic outline */
      -webkit-text-stroke: 2px var(--black);
      paint-order: stroke fill;
      position: relative;
    }

    h1 span { color: var(--red); }

    .tagline {
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      color: var(--blue);
      margin: 0.4rem 0 2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .speech-bubble {
      background: var(--yellow);
      border: 3px solid var(--black);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 24px;
      border: 7px solid transparent;
      border-top-color: var(--black);
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 25px;
      border: 6px solid transparent;
      border-top-color: var(--yellow);
      z-index: 1;
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    input[type="text"] {
      flex: 1;
      border: 3px solid var(--black);
      border-radius: 4px;
      padding: 0.7rem 1rem;
      font-family: 'Comic Neue', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      background: var(--white);
      outline: none;
      transition: box-shadow 0.15s;
    }
    input[type="text"]:focus {
      box-shadow: 4px 4px 0 var(--black);
    }
    input[type="text"]::placeholder { color: #aaa; font-weight: 400; }

    button#go-btn {
      background: var(--red);
      color: var(--white);
      border: 3px solid var(--black);
      border-radius: 4px;
      padding: 0.7rem 1.4rem;
      font-family: 'Bangers', cursive;
      font-size: 1.3rem;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--black);
      transition: transform 0.1s, box-shadow 0.1s;
      white-space: nowrap;
    }
    button#go-btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--black); }
    button#go-btn:active { transform: translate(2px,2px);   box-shadow: 2px 2px 0 var(--black); }
    button#go-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--black); }

    /* Status box */
    #status-box {
      display: none;
      border: 3px solid var(--black);
      border-radius: 4px;
      padding: 1.2rem;
      background: var(--white);
      margin-top: 1rem;
    }

    .status-label {
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-bottom: 0.6rem;
      color: var(--blue);
    }

    /* Progress bar */
    .progress-track {
      height: 18px;
      background: #eee;
      border: 2px solid var(--black);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.8rem;
    }
    .progress-fill {
      height: 100%;
      background: repeating-linear-gradient(
        45deg, var(--blue), var(--blue) 10px, #1a67e8 10px, #1a67e8 20px
      );
      width: 0%;
      transition: width 0.4s ease;
      animation: stripe-move 1s linear infinite;
    }
    @keyframes stripe-move {
      from { background-position: 0 0; }
      to   { background-position: 28px 0; }
    }

    #status-msg {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--black);
    }

    #download-btn {
      display: none;
      width: 100%;
      margin-top: 1rem;
      background: var(--blue);
      color: var(--white);
      border: 3px solid var(--black);
      border-radius: 4px;
      padding: 0.8rem;
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--black);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #download-btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--black); }
    #download-btn:active { transform: translate(2px,2px);   box-shadow: 2px 2px 0 var(--black); }

    .error-msg {
      color: var(--red);
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--black);
      opacity: 0.5;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="panel">
  <h1>COMIC<span>IFY</span></h1>
  <p class="tagline">Turn any YouTube video into a comic book PDF!</p>

  <div class="speech-bubble">
    Paste a YouTube link below and we'll generate your comic! 🦸
  </div>

  <div class="input-row">
    <input type="text" id="yt-link" placeholder="https://www.youtube.com/watch?v=..." />
    <button id="go-btn" onclick="startGeneration()">POW!</button>
  </div>
  <div class="error-msg" id="error-msg"></div>

  <div id="status-box">
    <div class="status-label">STATUS</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div id="status-msg">Starting...</div>
    <button id="download-btn" onclick="downloadPDF()">⬇ DOWNLOAD COMIC PDF</button>
  </div>
</div>

<footer>Comicify &mdash; YouTube → Comic PDF</footer>

<script>
  let currentJobId = null;
  let pollInterval = null;
  let progressVal = 0;

  const stages = [
    { keyword: 'Downloading',  pct: 20,  msg: '📥 Downloading video...' },
    { keyword: 'transcript',   pct: 35,  msg: '📝 Fetching subtitles...' },
    { keyword: 'Whisper',      pct: 35,  msg: '🎙️ Transcribing audio (this takes a while)...' },
    { keyword: 'running',      pct: 60,  msg: '🎨 Extracting frames & drawing panels...' },
    { keyword: 'done',         pct: 100, msg: '✅ Your comic is ready!' },
    { keyword: 'error',        pct: 0,   msg: '❌ Something went wrong.' },
  ];

  function setProgress(pct) {
    progressVal = pct;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function startGeneration() {
    const link = document.getElementById('yt-link').value.trim();
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('download-btn').style.display = 'none';

    if (!link) { showError('Please paste a YouTube link!'); return; }

    document.getElementById('go-btn').disabled = true;
    document.getElementById('status-box').style.display = 'block';
    document.getElementById('status-msg').textContent = 'Starting...';
    setProgress(5);

    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link })
    });
    const data = await res.json();

    if (data.error) { showError(data.error); document.getElementById('go-btn').disabled = false; return; }

    currentJobId = data.job_id;
    pollInterval = setInterval(pollStatus, 3000);
  }

  async function pollStatus() {
    if (!currentJobId) return;
    const res  = await fetch(`/status/${currentJobId}`);
    const data = await res.json();

    const stage = stages.find(s => data.status === s.keyword || (data.message && data.message.includes(s.keyword)));
    if (stage) {
      document.getElementById('status-msg').textContent = stage.msg;
      if (stage.pct > progressVal) setProgress(stage.pct);
    }

    if (data.status === 'done') {
      clearInterval(pollInterval);
      setProgress(100);
      document.getElementById('status-msg').textContent = '✅ Your comic is ready!';
      document.getElementById('download-btn').style.display = 'block';
      document.getElementById('go-btn').disabled = false;
    } else if (data.status === 'error') {
      clearInterval(pollInterval);
      showError('Error: ' + data.message);
      document.getElementById('go-btn').disabled = false;
    }
  }

  function downloadPDF() {
    window.location.href = `/download/${currentJobId}`;
  }
</script>
</body>
</html>

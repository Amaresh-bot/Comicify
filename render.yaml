services:
  - type: web
    name: comicify
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      apt-get install -y ffmpeg
    startCommand: gunicorn app:app --timeout 600 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: comicify-storage
      mountPath: /data
      sizeGB: 2
